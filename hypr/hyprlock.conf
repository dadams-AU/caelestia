# hyprlock -- the daily locker on all three hosts while the caelestia lock is
# benched (quickshell#897; see keybinds.lua). Colors baked from the caelestia
# dynamic scheme 2026-08-16. Background uses the wallpaper FILE via caelestia's
# stable `current` symlink -- never `screenshot`, screencopy is the broken
# thing here. Background, tint, input-field and host name have no `monitor`
# set so they render on every output on every host; the clock labels are
# per-host, matched by output name.
#
# Each host has its own color, so a glance says which machine is asking for a
# password: $accent and $tint come from hyprlock-host.conf, which the dotfiles
# repo stows per host. The glob keeps a host without that file on the defaults
# below instead of failing to lock.

$wallpaper = /home/dadams/.local/state/caelestia/wallpaper/current
$bg     = rgba(11, 15, 17, 1.0)
$fg     = rgba(223, 230, 237, 1.0)
$accent = rgba(166, 203, 230, 1.0)
$muted  = rgba(111, 118, 125, 1.0)
$inner  = rgba(21, 26, 30, 0.85)
$check  = rgba(218, 222, 255, 1.0)
$fail   = rgba(250, 116, 111, 1.0)
$tint   = rgba(0, 0, 0, 0.0)

source = /home/dadams/.config/caelestia/hyprlock-host*.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 440, 66
    rounding = 33
    outline_thickness = 2
    outer_color = $accent
    inner_color = $inner
    font_color = $fg
    font_family = Rubik
    check_color = $check
    fail_color = $fail
    placeholder_text = <span foreground="##6f767d"><i>password</i></span>
    fail_text = <i>wrong password ($ATTEMPTS)</i>
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -100
    halign = center
    valign = center
}

# A wash of the host color over the blurred wallpaper.
shape {
    monitor =
    size = 100%, 100%
    color = $tint
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = -1
}

label {
    monitor =
    text = cmd[update:0] sed 's|.*|<span letter_spacing="8000">&</span>|' /etc/hostname
    color = $accent
    font_family = Rubik
    font_size = 16
    position = 0, 48
    halign = center
    valign = bottom
}

# ---- thinkingdead flair ----

label {
    monitor = DP-5
    text = $TIME
    color = $fg
    font_family = Rubik Light
    font_size = 170
    position = 0, 310
    halign = center
    valign = center
}

label {
    monitor = DP-5
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $accent
    font_family = Rubik
    font_size = 36
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor = DP-4
    text = $TIME
    color = $muted
    font_family = Rubik Light
    font_size = 96
    position = 0, 400
    halign = center
    valign = center
}

# ---- runningdead flair ---- (DP-1 is the 4K main; the HDMI-A-1 touch panel
# gets the background and input field only)

label {
    monitor = DP-1
    text = $TIME
    color = $fg
    font_family = Rubik Light
    font_size = 170
    position = 0, 310
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $accent
    font_family = Rubik
    font_size = 36
    position = 0, 160
    halign = center
    valign = center
}

# ---- travelingdead flair ---- (the laptop panel)

label {
    monitor = eDP-1
    text = $TIME
    color = $fg
    font_family = Rubik Light
    font_size = 130
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $accent
    font_family = Rubik
    font_size = 30
    position = 0, 130
    halign = center
    valign = center
}
