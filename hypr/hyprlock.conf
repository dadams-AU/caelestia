# Minimal hyprlock config (created for emergency unlock recovery)
background {
    monitor =
    color = rgba(20, 20, 28, 1.0)
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.3
    outer_color = rgba(120, 130, 200, 1.0)
    inner_color = rgba(40, 40, 55, 1.0)
    font_color = rgba(220, 220, 230, 1.0)
    placeholder_text = <i>Password…</i>
    fail_text = <i>Wrong — try again</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter password to unlock
    color = rgba(200, 200, 210, 1.0)
    font_size = 22
    position = 0, 60
    halign = center
    valign = center
}
