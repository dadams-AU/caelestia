# hyprlock -- thinkingdead's daily locker while the caelestia lock is benched
# (quickshell#897; see keybinds.lua). Colors baked from the caelestia dynamic
# scheme 2026-08-16. Background uses the wallpaper FILE via caelestia's stable
# `current` symlink -- never `screenshot`, screencopy is the broken thing here.
# Background + input-field have no `monitor` set so they render on every
# output on every host; the clock labels are thinkingdead's monitors only.

$wallpaper = /home/dadams/.local/state/caelestia/wallpaper/current
$bg     = rgba(11, 15, 17, 1.0)
$fg     = rgba(223, 230, 237, 1.0)
$accent = rgba(166, 203, 230, 1.0)
$muted  = rgba(111, 118, 125, 1.0)
$inner  = rgba(21, 26, 30, 0.85)
$check  = rgba(218, 222, 255, 1.0)
$fail   = rgba(250, 116, 111, 1.0)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 440, 66
    rounding = 33
    outline_thickness = 2
    outer_color = $accent
    inner_color = $inner
    font_color = $fg
    font_family = Rubik
    check_color = $check
    fail_color = $fail
    placeholder_text = <span foreground="##6f767d"><i>password</i></span>
    fail_text = <i>wrong password ($ATTEMPTS)</i>
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -100
    halign = center
    valign = center
}

# ---- thinkingdead flair ----

label {
    monitor = DP-5
    text = $TIME
    color = $fg
    font_family = Rubik Light
    font_size = 170
    position = 0, 310
    halign = center
    valign = center
}

label {
    monitor = DP-5
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $accent
    font_family = Rubik
    font_size = 36
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor = DP-4
    text = $TIME
    color = $muted
    font_family = Rubik Light
    font_size = 96
    position = 0, 400
    halign = center
    valign = center
}
