# hypridle -- only on travelingdead, and only for suspend (execs.lua starts it
# there). It replaces the shell's lockBeforeSleep, which is off on that host
# (dotfiles shell.json): that locked with the caelestia lock, and with
# misc:allow_session_lock_restore on, Hyprland hands the session to a new
# locker even while hyprlock already holds it. The replaced hyprlock keeps
# running without a lock, so `pidof hyprlock || hyprlock` (lock bind, idle
# timeout) then does nothing until that process is killed.
#
# No listeners: the shell's idle timeouts still do the idle lock and dpms, so
# "No rules configured" at startup is expected. No lock_cmd either: the shell
# answers logind's Lock signal itself, and a second locker on that signal
# would strand hyprlock the same way.
#
# inhibit_sleep = 3 holds a logind delay inhibitor while unlocked and drops it
# once Hyprland reports the session locked, so the lid cannot suspend before
# hyprlock is up (the shell's lock took no inhibitor and raced the suspend).

general {
    before_sleep_cmd = pidof hyprlock || hyprlock
    inhibit_sleep = 3
}
